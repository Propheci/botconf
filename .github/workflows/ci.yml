name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: nix flake check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31

      # Build, clippy (warnings denied), tests, rustfmt and taplo; see
      # `checks` in flake.nix.
      - run: nix flake check --print-build-logs --keep-going

  msrv:
    name: minimum Rust (${{ matrix.package }} on ${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: botconf
            toolchain: "1.95.0"
            args: --all-features
          - package: botconf-panel
            toolchain: "1.95.0"
            args: --all-features
          - package: botconf-grpc
            toolchain: "1.95.0"
            args: --all-features
          - package: botconf-telegram
            toolchain: "1.96.0"
            args: ""
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      # botconf-grpc's build script compiles proto/ with protoc. Ubuntu's
      # protoc (3.21 on 24.04) supports proto3 `optional` fields.
      - if: matrix.package == 'botconf-grpc'
        run: sudo apt-get update && sudo apt-get install --yes protobuf-compiler
      # `+toolchain`: rust-toolchain.toml pins the dev toolchain, which would
      # otherwise win over the toolchain installed above.
      - run: cargo +${{ matrix.toolchain }} test --locked -p ${{ matrix.package }} ${{ matrix.args }}
