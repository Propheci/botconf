[package]
name = "botconf-telegram"
description = "A Telegram settings panel (buttons, pickers, prompts) for botconf settings"
version.workspace = true
edition.workspace = true
# takecell 0.1.2 (teloxide-core 0.13) declares 1.96; the crate itself needs
# no more than the workspace's 1.95.
rust-version = "1.96"
license.workspace = true
repository.workspace = true

[dependencies]
anyhow = { workspace = true }
botconf = { workspace = true }
futures = { workspace = true }
serde_json = { workspace = true }
teloxide = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
figment = { workspace = true, features = ["env", "toml"] }
serde = { workspace = true, features = ["derive"] }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "test-util"] }
