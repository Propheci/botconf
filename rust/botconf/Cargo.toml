[package]
name = "botconf"
description = "Runtime-editable, typed bot settings: config file < environment < stored overrides"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
## Stores the overrides in a SQL table with SeaORM.
sea-orm = ["dep:sea-orm", "dep:chrono"]
## A clap subcommand to view and change the settings from a terminal.
cli = ["dep:clap"]

[dependencies]
arc-swap = { workspace = true }
chrono = { workspace = true, optional = true }
clap = { workspace = true, optional = true }
figment = { workspace = true }
futures = { workspace = true }
sea-orm = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync"] }
tracing = { workspace = true }

[dev-dependencies]
figment = { workspace = true, features = ["test", "toml"] }
serde = { workspace = true, features = ["derive"] }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "test-util"] }
