[workspace]
members = ["rust/*"]
resolver = "3"

[workspace.package]
version = "0.6.0"
edition = "2024"
# The lowest version that builds and passes; CI tests it.
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/propheci/botconf"

[workspace.dependencies]
botconf = { path = "rust/botconf" }
botconf-panel = { path = "rust/botconf-panel" }

# These are libraries, so the requirements are floors, not pins: the oldest
# releases that resolve and pass with `cargo update -Z direct-minimal-versions`
# (some floors, e.g. thiserror and serde, are set by teloxide and sea-orm), with
# only the features the crates use. Dependents keep their own lock files and
# turn on more features themselves (the assistant bot enables serde_json's
# `preserve_order`; botconf does not need it). CI builds with the lock file.
anyhow = "1.0.80"
arc-swap = "1.6"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde"] }
clap = { version = "4.5", features = ["derive"] }
figment = "0.10.19"
futures = "0.3.30"
sea-orm = { version = "2.0.3", default-features = false, features = [
  "macros",
  "with-chrono",
  "runtime-tokio-rustls",
  "sqlx-postgres",
  "sqlx-sqlite",
] }
serde = "1.0.219"
serde_json = "1.0.142"
teloxide = { version = "0.17.0", default-features = false, features = [
  "cache-me",
  "ctrlc_handler",
  "macros",
  "rustls",
  "throttle",
  "tracing",
] }
thiserror = "2.0.18"
tokio = "1.39"
tracing = "0.1.40"

# botconf-grpc's services are added to the host's tonic server, so tonic's
# major version must be the host's (wuphf: tonic 0.12, prost 0.13). Upgrading
# it is a coordinated change: botconf first, then the hosts.
prost = "0.13"
tokio-stream = "0.1"
tonic = "0.12"
tonic-build = "0.12"
